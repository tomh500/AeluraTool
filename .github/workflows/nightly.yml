name: Build and nightly release

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Docs/**'
  workflow_dispatch:
    inputs:
      verify_install:
        description: Build a signed archive and test Install.bat on a separate Windows runner
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/artifacts/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: NuGet/setup-nuget@v2
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE) { throw 'NuGet restore failed' }
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-vs2026-vcpkg-66c0373dc7fca549e5803087b9487edfe3aca0a1-v1
      - name: Restore native dependencies
        shell: pwsh
        run: |
          New-Item $env:VCPKG_DEFAULT_BINARY_CACHE -ItemType Directory -Force | Out-Null
          git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE/vcpkg"
          if ($LASTEXITCODE) { throw 'vcpkg clone failed' }
          git -C "$env:USERPROFILE/vcpkg" checkout 66c0373dc7fca549e5803087b9487edfe3aca0a1
          if ($LASTEXITCODE) { throw 'vcpkg checkout failed' }
          & "$env:USERPROFILE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          & "$env:USERPROFILE/vcpkg/vcpkg.exe" install nlohmann-json 'cpp-httplib[brotli]' yaml-cpp sdl2 sdl2-mixer sdl2-ttf simdjson --triplet x64-windows-static
          if ($LASTEXITCODE) { throw 'vcpkg restore failed' }
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-vs2026-vcpkg-66c0373dc7fca549e5803087b9487edfe3aca0a1-v1
      - name: Generate timestamp version
        id: version
        shell: pwsh
        run: ./scripts/nightly-version.ps1
      - name: Build and test Release and Debug
        shell: pwsh
        run: |
          python Tests/check_installer.py
          if ($LASTEXITCODE) { throw 'Installer launcher tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests/installer_dependencies.ps1
          if ($LASTEXITCODE) { throw 'Installer dependency tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests/install_smoke_safety.ps1
          if ($LASTEXITCODE) { throw 'Installation harness safety checks failed' }
          ./scripts/build.ps1 -Configuration Release
          ./scripts/test.ps1 -Configuration Release
          ./scripts/build.ps1 -Configuration Debug
          ./scripts/test.ps1 -Configuration Debug
      - name: Package signed nightly and check installer
        id: package
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.verify_install)
        shell: pwsh
        env:
          MSIX_SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
          MSIX_SIGNING_PFX_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
          NIGHTLY_NAME: AeluraTool-nightly-${{ steps.version.outputs.stamp }}-${{ github.run_id }}-${{ github.run_attempt }}-x64
        run: |
          ./scripts/package-nightly.ps1
          "ready=true" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.ready == 'true'
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nightly/*
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.log
          if-no-files-found: ignore
    outputs:
      stamp: ${{ steps.version.outputs.stamp }}
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.package.outputs.ready }}

  install:
    if: needs.build.outputs.signed == 'true'
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: install-input
      - name: Install through the user BAT and activate the packaged app
        shell: powershell
        run: ./Tests/install_smoke.ps1 -ArtifactDirectory ./install-input -ReportDirectory ./artifacts/install-smoke
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/install-smoke/*
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_STAMP: ${{ needs.build.outputs.stamp }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          tag="nightly-${BUILD_STAMP}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'Branch: %s\nCommit: %s\nUTC: %s\nMSIX version: %s\n\nSigned Windows x64 test package. Extract the entire ZIP and double-click Install.bat. On first installation, verify the publisher certificate before allowing the trust prompt.\n' "$BRANCH" "$GITHUB_SHA" "$BUILD_STAMP" "$PACKAGE_VERSION" > notes.md
          gh release create "$tag" nightly/* --target "$GITHUB_SHA" --prerelease --latest=false --title "Nightly ${BUILD_STAMP} (${BRANCH})" --notes-file notes.md
